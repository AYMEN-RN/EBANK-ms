<div class="p-3">
  @if (accounts$|async; as accountsList) {
    <table class="table">
      <thead>
      <tr>
        <th>ID</th>
        <th>Balance</th>
        <th>Type</th>
        <th>CustomerId</th>
        <th>Date</th>
      </tr>
      </thead>
      <tbody>
        @for (acc of accountsList; track acc){
          <tr>
            <td>{{acc.id}}</td>
            <td>{{acc.balance}}</td>
            <td>{{acc.accType}}</td>
            <td>{{acc.customerId}}</td>
            <td>{{acc.createdAt}}</td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
